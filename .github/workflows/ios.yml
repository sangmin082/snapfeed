name: iOS TestFlight

# 수동 실행(Actions 탭 → Run workflow) 또는 v* 태그 push 시 빌드.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# --- 이 값들만 프로젝트에 맞게 확인하세요 ---
env:
  BUNDLE_ID: com.snapfeed.com            # capacitor.config.ts 의 appId 와 동일해야 함
  SCHEME: App                            # Capacitor iOS 기본 스킴
  XCODE_VERSION: "16.2"                  # 러너에 설치된 Xcode 버전

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Use the runner's default Xcode — it already ships a matching iOS SDK, so we
      # avoid the flaky multi-GB `-downloadPlatform iOS` that intermittently failed.
      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # ios/ 네이티브 프로젝트를 러너에서 생성 (로컬 Mac 불필요)
      - name: Generate iOS project
        run: |
          npx cap add ios || npx cap sync ios
          npx cap sync ios

      # App Store Connect API 키(.p8)를 altool/xcodebuild 가 찾는 위치에 배치
      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      - name: Build & upload to TestFlight (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ github.workspace }}/asc_key.p8
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 "$ASC_KEY_PATH"
          fastlane ios beta

      - name: Cleanup keys
        if: always()
        run: rm -rf ~/private_keys ~/.appstoreconnect "${{ github.workspace }}/asc_key.p8"
