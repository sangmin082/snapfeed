name: iOS TestFlight

# 수동 실행(Actions 탭 → Run workflow) 또는 v* 태그 push 시 빌드.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# BUNDLE_ID must match capacitor.config.ts appId and the App Store Connect record.
env:
  BUNDLE_ID: com.snapfeed.com

jobs:
  build:
    runs-on: macos-26 # Apple requires the iOS 26 SDK (Xcode 26) for App Store uploads
    permissions:
      contents: write # allow match to push encrypted certs to the match-certs branch
    steps:
      - uses: actions/checkout@v4

      # Select the newest Xcode on the runner (needs Xcode 26 for the iOS 26 SDK
      # that App Store Connect now requires).
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # ios/ 네이티브 프로젝트를 러너에서 생성 (로컬 Mac 불필요)
      - name: Generate iOS project
        run: |
          npx cap add ios || npx cap sync ios
          npx cap sync ios

      # Universal links (email-confirmation opens the app) + Sign in with Apple.
      # The App ID must have both capabilities enabled in the developer portal.
      - name: Add entitlements
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:snapfeed.sangmin082.workers.dev</string>
              <string>webcredentials:snapfeed.sangmin082.workers.dev</string>
            </array>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
          </dict>
          </plist>
          EOF

      # Apple rejects binaries that reference camera / photo APIs without
      # user-facing purpose strings (ITMS-90683). The ios/ project is generated
      # on the runner, so inject them into Info.plist here.
      - name: Add Info.plist purpose strings
        run: |
          PLIST="ios/App/App/Info.plist"
          add() { /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"; }
          add NSCameraUsageDescription "수기 수유 기록지를 촬영해 자동으로 기록을 인식하기 위해 카메라를 사용합니다."
          add NSPhotoLibraryUsageDescription "앨범에 저장된 수유 기록지 사진을 선택해 기록을 인식하기 위해 사진 보관함에 접근합니다."
          add NSPhotoLibraryAddUsageDescription "촬영한 기록지 사진을 사진 보관함에 저장하기 위해 사용합니다."

      # Inject the app icon directly into the asset catalog. We avoid
      # @capacitor/assets because it needs sharp, whose native build is disabled
      # in this repo. Modern Xcode accepts a single 1024×1024 universal icon.
      - name: Set app icon
        run: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          rm -f "$ICONSET"/*.png
          cp assets/icon.png "$ICONSET/AppIcon-512@2x.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images": [
              { "filename": "AppIcon-512@2x.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF

      # App Store Connect API 키(.p8)를 altool/xcodebuild 가 찾는 위치에 배치
      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      - name: Build & upload to TestFlight (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ github.workspace }}/asc_key.p8
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_TOKEN_FOR_MATCH: ${{ github.token }}
          FASTLANE_LANE: beta # switch to "certs_nuke" for a one-time cert reset
        run: |
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 "$ASC_KEY_PATH"
          export MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s' "x-access-token:${GH_TOKEN_FOR_MATCH}" | base64 | tr -d '\n')
          fastlane ios "${FASTLANE_LANE}"

      - name: Cleanup keys
        if: always()
        run: rm -rf ~/private_keys ~/.appstoreconnect "${{ github.workspace }}/asc_key.p8"
