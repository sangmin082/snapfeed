<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- camera top hump -->
  <rect x="368" y="252" width="288" height="140" rx="56" fill="#ffffff"/>
  <!-- camera body -->
  <rect x="168" y="320" width="688" height="464" rx="108" fill="#ffffff"/>

  <!-- lens ring -->
  <circle cx="512" cy="552" r="182" fill="#059669"/>
  <circle cx="512" cy="552" r="144" fill="url(#lens)"/>

  <!-- baby bottle inside the lens -->
  <g transform="translate(440 428)">
    <!-- nipple -->
    <path d="M 56 6 Q 72 -16 88 6 L 88 30 L 56 30 Z" fill="#f9a8d4"/>
    <!-- collar -->
    <rect x="46" y="28" width="52" height="22" rx="8" fill="#e5e7eb"/>
    <!-- body -->
    <rect x="38" y="48" width="68" height="150" rx="18" fill="#ffffff" stroke="#059669" stroke-width="7"/>
    <!-- milk level -->
    <path d="M 41 130 Q 72 121 103 130 L 103 176 Q 103 195 84 195 L 60 195 Q 41 195 41 176 Z" fill="#fde68a"/>
    <!-- measurement lines -->
    <line x1="50" y1="78" x2="66" y2="78" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="104" x2="66" y2="104" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="130" x2="66" y2="130" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- sparkle where the flash would be -->
  <g transform="translate(756 396)" fill="#fbbf24">
    <path d="M 0 -34 C 5 -10 10 -5 34 0 C 10 5 5 10 0 34 C -5 10 -10 5 -34 0 C -10 -5 -5 -10 0 -34 Z"/>
  </g>
  <g transform="translate(806 470)" fill="#fcd34d">
    <path d="M 0 -14 C 2 -4 4 -2 14 0 C 4 2 2 4 0 14 C -2 4 -4 2 -14 0 C -4 -2 -2 -4 0 -14 Z"/>
  </g>
</svg>
