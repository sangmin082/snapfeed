<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="0.5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7f0"/>
      <stop offset="1" stop-color="#fdeee6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- background sparkles -->
  <g fill="#ffffff" opacity="0.85">
    <path transform="translate(168 244)" d="M 0 -30 C 4 -9 9 -4 30 0 C 9 4 4 9 0 30 C -4 9 -9 4 -30 0 C -9 -4 -4 -9 0 -30 Z"/>
    <path transform="translate(864 726)" d="M 0 -22 C 3 -7 7 -3 22 0 C 7 3 3 7 0 22 C -3 7 -7 3 -22 0 C -7 -3 -3 -7 0 -22 Z" opacity="0.7"/>
  </g>

  <!-- polaroid -->
  <g transform="rotate(-6 512 512)">
    <rect x="286" y="222" width="452" height="580" rx="36" fill="#ffffff" filter="url(#shadow)"/>
    <!-- photo window -->
    <rect x="326" y="262" width="372" height="392" rx="22" fill="url(#photo)"/>

    <!-- baby bottle -->
    <g transform="translate(512 292)">
      <!-- teat -->
      <path d="M -34 74 C -34 30 -20 6 0 6 C 20 6 34 30 34 74 Z" fill="#fdba74"/>
      <!-- flange -->
      <rect x="-52" y="66" width="104" height="26" rx="12" fill="#fb923c"/>
      <!-- cap ring -->
      <rect x="-62" y="92" width="124" height="40" rx="16" fill="#6ee7b7"/>
      <!-- body -->
      <rect x="-80" y="130" width="160" height="228" rx="34" fill="#ffffff" stroke="#f43f5e" stroke-width="11"/>
      <!-- milk -->
      <path d="M -69 216 C -40 202 -8 230 24 216 C 44 208 58 210 69 216 L 69 322 C 69 339 55 352 38 352 L -38 352 C -55 352 -69 339 -69 322 Z" fill="#fde68a"/>
      <!-- milk shine -->
      <ellipse cx="-30" cy="252" rx="14" ry="26" fill="#ffffff" opacity="0.45" transform="rotate(-14 -30 252)"/>
      <!-- measurement ticks -->
      <line x1="42" y1="176" x2="62" y2="176" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
      <line x1="42" y1="216" x2="62" y2="216" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
      <line x1="42" y1="256" x2="62" y2="256" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- handwritten caption: squiggle + heart -->
    <g stroke="#d6c9c1" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M 344 712 C 372 700 396 722 424 712 C 452 702 476 722 504 712 C 526 704 546 718 566 712"/>
      <path d="M 344 754 C 366 744 386 762 408 754 C 430 746 450 762 472 754"/>
    </g>
    <path transform="translate(636 726) scale(1.05)" fill="#fb7185"
      d="M 0 10 C -12 -8 -38 -2 -38 20 C -38 40 -12 52 0 62 C 12 52 38 40 38 20 C 38 -2 12 -8 0 10 Z"/>
  </g>

  <!-- heart sticker on the corner -->
  <g transform="rotate(10 742 240)">
    <path transform="translate(742 218) scale(1.6)" fill="#e11d48" stroke="#ffffff" stroke-width="9"
      d="M 0 10 C -12 -8 -38 -2 -38 20 C -38 40 -12 52 0 62 C 12 52 38 40 38 20 C 38 -2 12 -8 0 10 Z"/>
  </g>
</svg>
