<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#fdeee9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#831843" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- background sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path transform="translate(150 232)" d="M 0 -30 C 4 -9 9 -4 30 0 C 9 4 4 9 0 30 C -4 9 -9 4 -30 0 C -9 -4 -4 -9 0 -30 Z"/>
    <path transform="translate(876 748)" d="M 0 -22 C 3 -7 7 -3 22 0 C 7 3 3 7 0 22 C -3 7 -7 3 -22 0 C -7 -3 -3 -7 0 -22 Z" opacity="0.75"/>
  </g>

  <!-- polaroid -->
  <g transform="rotate(-6 512 512)">
    <rect x="248" y="192" width="528" height="656" rx="40" fill="#ffffff" filter="url(#shadow)"/>
    <!-- photo window -->
    <rect x="292" y="236" width="440" height="452" rx="24" fill="url(#photo)"/>

    <!-- baby bottle (fills the photo) -->
    <g transform="translate(512 256)">
      <!-- teat -->
      <path d="M -42 88 C -42 36 -25 8 0 8 C 25 8 42 36 42 88 Z" fill="#fdba74"/>
      <!-- flange -->
      <rect x="-62" y="80" width="124" height="30" rx="14" fill="#fb923c"/>
      <!-- cap ring -->
      <rect x="-76" y="110" width="152" height="48" rx="19" fill="#5eead4"/>
      <!-- body -->
      <rect x="-96" y="156" width="192" height="264" rx="40" fill="#ffffff" stroke="#db2777" stroke-width="12"/>
      <!-- milk -->
      <path d="M -83 258 C -48 240 -10 272 28 258 C 54 248 70 252 83 258 L 83 364 C 83 386 66 402 44 402 L -44 402 C -66 402 -83 386 -83 364 Z" fill="#fde68a"/>
      <!-- milk shine -->
      <ellipse cx="-36" cy="304" rx="16" ry="30" fill="#ffffff" opacity="0.5" transform="rotate(-14 -36 304)"/>
      <!-- measurement ticks -->
      <line x1="50" y1="208" x2="74" y2="208" stroke="#db2777" stroke-width="9" stroke-linecap="round"/>
      <line x1="50" y1="256" x2="74" y2="256" stroke="#db2777" stroke-width="9" stroke-linecap="round"/>
      <line x1="50" y1="304" x2="74" y2="304" stroke="#db2777" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- handwritten caption: squiggle + heart -->
    <g stroke="#d8cac2" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M 312 764 C 342 750 370 776 402 764 C 434 752 462 776 494 764 C 520 754 544 772 566 764"/>
    </g>
    <path transform="translate(646 736) scale(1.15)" fill="#f472b6"
      d="M 0 10 C -12 -8 -38 -2 -38 20 C -38 40 -12 52 0 62 C 12 52 38 40 38 20 C 38 -2 12 -8 0 10 Z"/>
  </g>

  <!-- heart sticker on the corner -->
  <g transform="rotate(12 766 216)">
    <path transform="translate(766 192) scale(1.7)" fill="#be185d" stroke="#ffffff" stroke-width="9"
      d="M 0 10 C -12 -8 -38 -2 -38 20 C -38 40 -12 52 0 62 C 12 52 38 40 38 20 C 38 -2 12 -8 0 10 Z"/>
  </g>
</svg>
